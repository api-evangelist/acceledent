x-domain-note: >-
  acceledent.com was re-registered on 2022-08-30 (GoDaddy.com, LLC; name servers
  ns1/ns2.afternic.com) after OrthoAccel wound down, and now serves a GoDaddy aftermarket
  sales lander. It answers HTTP 200 with the SAME 114-byte HTML redirect stub on EVERY path
  — including /openapi.json and every /.well-known/* path — and /lander itself returns 403
  from an Akamai edge naming forsale.godaddy.com/forsale/acceledent.com as the target. Those
  200s are not documents. DNS is a wildcard, so api./docs./developer./shop. all resolve, but
  no TLS certificate covers them. See well-known/acceledent-well-known.yml. This host is NOT
  controlled by AcceleDent and is deliberately not wired as a Website pointer (roadmap#56).
