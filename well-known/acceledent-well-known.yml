name: AcceleDent well-known + contract discovery probe
description: >-
  Negative probe record for AcceleDent (OrthoAccel Technologies, Inc.). AcceleDent was an
  FDA-cleared Class II orthodontic vibration device — a physical medical device, not software —
  and OrthoAccel is reported defunct. The acceledent.com registration in place today was
  CREATED 2022-08-30, years after the company wound down, and now sits on Afternic name
  servers as a GoDaddy aftermarket "for sale" listing. That parking system answers HTTP 200
  with the SAME 114-byte HTML redirect shell on EVERY path, including every /.well-known/*
  path and every spec path, and it publishes its own robots.txt, sitemap.xml and llms.txt
  about the domain being for sale. NONE of those 200s is a document authored by AcceleDent.
  No WellKnown, SecurityTxt, AgentCard, LLMsTxt or OpenAPI pointer is emitted from this
  probe, and none should ever be emitted from it in a later round.

