conclusion: >-
  AcceleDent has no API surface to enrich and no host its company still controls. OrthoAccel
  Technologies built a physical Class II medical device; it never operated a developer
  program, published no OpenAPI/AsyncAPI/GraphQL/MCP/A2A contract, shipped no SDKs, and the
  domain that carried its brand has since been re-registered and put up for sale. This is a
  historical record, not a thin profile. Any future round should re-read host_status before
  probing acceledent.com again.
