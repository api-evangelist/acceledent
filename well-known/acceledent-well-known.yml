    ## Status
    - For sale: Yes
    - Listed on: GoDaddy (aftermarket)
    - Marketplace listing: https://forsale.godaddy.com/forsale/acceledent.com
    - Escrow / transfer: GoDaddy-backed, typical 5-7 business-day completion

